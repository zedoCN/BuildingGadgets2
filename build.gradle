plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.148'
}
version = mod_version
group = mod_group_id
base { archivesName = mod_id }
java { toolchain.languageVersion = JavaLanguageVersion.of(25); withSourcesJar() }
repositories {
    mavenCentral()
    maven { url = 'https://api.modrinth.com/maven' }
}
dependencies {
    implementation "maven.modrinth:curios:${curios_version}"
}
neoForge {
    enable { version = neo_version; disableRecompilation = true }
    accessTransformers.from file('src/main/resources/META-INF/accesstransformer.cfg')
    runs {
        client { client(); gameDirectory = file('runs/client'); programArguments.addAll '--username', 'TechPortTest'; if (project.hasProperty('testServer')) programArguments.addAll '--quickPlayMultiplayer', project.property('testServer') }
        server { server(); gameDirectory = file('runs/server'); programArgument '--nogui' }
        clientData {
            type = 'clientData'
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated-client/resources').absolutePath, '--existing', file('src/main/resources').absolutePath
        }
        serverData {
            type = 'serverData'
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated-data/resources').absolutePath, '--existing', file('src/main/resources').absolutePath
        }
        configureEach { jvmArguments.add '--enable-native-access=ALL-UNNAMED' }
    }
    mods { buildinggadgets2 { sourceSet sourceSets.main } }
}
sourceSets.main.resources {
    srcDir 'src/generated-client/resources'
    srcDir 'src/generated-data/resources'
    exclude '**/.cache/**'
}
processResources {
    def properties = ['minecraft_version', 'minecraft_version_range', 'neo_version', 'neo_version_range', 'loader_version_range', 'mod_id', 'mod_name', 'mod_license', 'mod_version', 'mod_authors', 'mod_description'].collectEntries { [(it): project.property(it)] }
    inputs.properties properties
    filesMatching('META-INF/neoforge.mods.toml') { expand properties }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs.addAll '-Xmaxerrs', '250' }
jar { from 'LICENSE' }

dependencies {
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.4'
}
neoForge.unitTest {
    enable()
    testedMod = neoForge.mods.buildinggadgets2
}
test { useJUnitPlatform(); testLogging { events 'passed', 'failed'; showStandardStreams = true } }
